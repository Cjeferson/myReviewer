<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Girlie Multiple Choice Reviewer 🎀</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff8fb;
      --surface: #ffffff;
      --surface-soft: #fff1f6;
      --border: #f1d6e0;
      --accent: #d96b97;
      --accent-dark: #a94f75;
      --text: #4f3741;
      --muted: #8d6b79;
      --success-bg: #eef8f2;
      --success: #47785e;
      --danger-bg: #fff0f2;
      --danger: #b75b70;
      --shadow: 0 16px 50px rgba(145, 77, 105, 0.12);
      --radius: 20px;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #fffafc 0%, #fff3f7 100%);
      padding: clamp(12px, 3vw, 28px);
    }

    button { font: inherit; }

    .decoration {
      position: fixed;
      pointer-events: none;
      opacity: .16;
      font-size: clamp(20px, 3vw, 30px);
      z-index: 0;
    }
    .heart-1 { top: 7%; left: 4%; }
    .heart-2 { top: 12%; right: 5%; }
    .heart-3 { bottom: 8%; left: 5%; }
    .heart-4 { bottom: 10%; right: 4%; }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 880px);
      margin: 0 auto;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: clamp(18px, 3vw, 26px);
      box-shadow: var(--shadow);
      padding: clamp(16px, 3vw, 30px);
    }

    header {
      display: flex;
      justify-content: center;
      margin-bottom: clamp(16px, 2.5vw, 24px);
    }

    .mini-title {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .set-selector { text-align: center; }

    .set-selector h2 {
      max-width: 680px;
      margin: 0 auto 8px;
      color: var(--text);
      font-size: clamp(24px, 5vw, 36px);
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .set-selector > p {
      max-width: 560px;
      margin: 0 auto clamp(18px, 3vw, 26px);
      color: var(--muted);
      font-size: clamp(13px, 2.5vw, 15px);
      line-height: 1.5;
    }

    .set-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 12px;
    }

    button {
      border: 0;
      outline: 0;
      border-radius: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    }

    button:focus-visible {
      outline: 3px solid rgba(217,107,151,.25);
      outline-offset: 2px;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { cursor: default; }

    .set-btn {
      min-height: 92px;
      padding: 18px 16px;
      background: var(--surface);
      color: var(--accent-dark);
      border: 1px solid var(--border);
      box-shadow: 0 6px 18px rgba(145,77,105,.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .set-btn:hover { background: var(--surface-soft); }
    .set-btn.all-sets { background: linear-gradient(180deg, #fff6f9, #fff); }
    .set-name { font-size: 16px; font-weight: 800; }
    .set-count { color: var(--muted); font-size: 12px; font-weight: 600; }

    .quiz-area[hidden], .set-selector[hidden] { display: none !important; }

    .quiz-toolbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 16px;
    }

    .change-set-btn,
    .secondary-btn,
    .shuffle-btn,
    .primary-btn {
      min-height: 46px;
      padding: 11px 15px;
      font-size: 13px;
      font-weight: 800;
    }

    .change-set-btn,
    .secondary-btn,
    .shuffle-btn {
      background: var(--surface);
      color: var(--accent-dark);
      border: 1px solid var(--border);
    }

    .primary-btn {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(217,107,151,.22);
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-container {
      width: 100%;
      height: 7px;
      margin-bottom: 18px;
      overflow: hidden;
      background: #f5dce5;
      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--accent);
      transition: width .25s ease;
    }

    .question-card {
      position: relative;
      padding: clamp(54px, 7vw, 64px) clamp(16px, 4vw, 30px) clamp(18px, 4vw, 28px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 28px rgba(145,77,105,.08);
    }

    .card-label {
      position: absolute;
      top: 18px;
      left: clamp(16px, 4vw, 30px);
      max-width: calc(100% - 80px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .bow {
      position: absolute;
      top: 13px;
      right: 18px;
      font-size: 24px;
    }

    .question-text {
      color: var(--text);
      font-size: clamp(17px, 3vw, 22px);
      font-weight: 750;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .choice-title {
      margin: 22px 0 10px;
      color: var(--muted);
      text-align: left;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .choice-btn {
      width: 100%;
      min-height: 58px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fffafd;
      color: var(--text);
      border: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.4;
    }

    .choice-btn:hover:not(:disabled) {
      background: var(--surface-soft);
      border-color: #e7b9cb;
    }

    .choice-letter {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 900;
    }

    .choice-text {
      flex: 1;
      min-width: 0;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .choice-btn.correct {
      background: var(--success-bg);
      color: var(--success);
      border-color: #cbe5d6;
    }

    .choice-btn.wrong {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #f2cbd4;
    }

    .choice-btn.dimmed { opacity: .52; }

    .feedback {
      min-height: 46px;
      margin-top: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fffafd;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    .feedback.correct {
      background: var(--success-bg);
      color: var(--success);
      border-color: #cbe5d6;
    }

    .feedback.wrong {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #f2cbd4;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0,1fr) 52px minmax(0,1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .shuffle-btn {
      width: 52px;
      min-width: 52px;
      padding-inline: 0;
      font-size: 17px;
    }

    .score-area {
      margin-top: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }

    .score-area span {
      color: var(--accent-dark);
      font-weight: 800;
    }

    @media (min-width: 760px) {
      .set-btn.all-sets { grid-column: 1 / -1; }
      .choices { gap: 11px; }
      .choice-btn { padding: 13px 16px; }
    }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .app { min-height: calc(100dvh - 20px); box-shadow: none; }
      .decoration { display: none; }
      header { margin-bottom: 14px; }
      .set-grid { grid-template-columns: 1fr; }
      .set-btn.all-sets { grid-column: auto; }
      .quiz-toolbar { margin-bottom: 12px; }
      .change-set-btn { width: 100%; }
      .question-card { border-radius: 17px; }
      .controls { grid-template-columns: 1fr 48px 1fr; gap: 8px; }
      .shuffle-btn { width: 48px; min-width: 48px; }
      .secondary-btn, .primary-btn { padding-inline: 10px; }
    }

    @media (max-width: 380px) {
      .mini-title { font-size: 10px; letter-spacing: 1px; }
      .question-text { font-size: 16px; }
      .choice-btn { padding: 11px 10px; font-size: 13px; }
      .choice-letter { width: 31px; height: 31px; flex-basis: 31px; }
      .controls { grid-template-columns: 1fr 44px 1fr; }
      .shuffle-btn { width: 44px; min-width: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="decoration heart-1">♡</div>
  <div class="decoration heart-2">🎀</div>
  <div class="decoration heart-3">✿</div>
  <div class="decoration heart-4">♡</div>

  <main class="app">
    <header>
      <div class="mini-title">✿ Study Session ✿</div>
    </header>

    <section class="set-selector" id="setSelector">
      <h2>Choose a Question Set 🎀</h2>
      <p>Select what you want to review first.</p>
      <div class="set-grid" id="setGrid"></div>
    </section>

    <section class="quiz-area" id="quizArea" hidden>
      <div class="quiz-toolbar">
        <button class="change-set-btn" type="button" onclick="showSetSelector()">← Change Question Set</button>
      </div>

      <div class="status-row">
        <span id="cardNumber">Card 1</span>
        <span id="percentage">0%</span>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <section class="question-card">
        <span class="card-label" id="sectionLabel">Question</span>
        <span class="bow">🎀</span>
        <div class="question-text" id="question"></div>

        <div class="choice-title">Choose your answer</div>
        <div class="choices" id="choices"></div>

        <div class="feedback" id="feedback">Select an answer.</div>
      </section>

      <div class="controls">
        <button class="secondary-btn" onclick="previousCard()">← Previous</button>
        <button class="shuffle-btn" title="Shuffle questions" onclick="shuffleCards()">🔀</button>
        <button class="primary-btn" onclick="nextCard()">Next →</button>
      </div>

      <div class="score-area">
        Correct <span id="knownCount">0</span> out of <span id="totalCards">0</span> questions ♡
      </div>
    </section>
  </main>

    function stripQuestionNumber(text) {
      return String(text ?? "")
        .replace(/^\s*[\u2018\u2019'"“”_\-:;,.|]*\s*\d+\s*[\.\)\]|,:-]*\s*/, "")
        .trim();
    }

    function isDeletedQuestion(text) {
      return /^DELETED\b/i.test(stripQuestionNumber(text));
    }

    function cleanChoiceText(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/\s+/g, " ")
        .replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g, "")
        .trim();
    }

    function buildFlashcards(data) {
      const cards = [];
      let sequence = 0;

      for (const [section, items] of Object.entries(data.sets || {})) {
        if (!Array.isArray(items)) continue;

        for (const item of items) {
          const rawQuestion = String(item?.question ?? "");

          // Do not include questions explicitly marked DELETED.
          if (!rawQuestion.trim() || isDeletedQuestion(rawQuestion)) continue;

          // Remove the source question number before displaying it.
          const questionText = stripQuestionNumber(rawQuestion);

          // Ignore malformed entries that contain only a number/punctuation.
          if (!questionText || !/[A-Za-z0-9]/.test(questionText)) continue;

          const rawChoices =
            item?.choices && typeof item.choices === "object"
              ? item.choices
              : {};

          const normalizedChoices = {};
          const preferredOrder = ["A", "B", "C", "D", "E", "F"];

          for (const letter of preferredOrder) {
            if (!Object.prototype.hasOwnProperty.call(rawChoices, letter)) continue;

            const cleanedValue = cleanChoiceText(rawChoices[letter]);

            // Never render null, blank, or placeholder choices.
            if (!cleanedValue) continue;

            normalizedChoices[letter] = cleanedValue;
          }

          // Skip malformed questions that do not have at least 2 usable choices.
          if (Object.keys(normalizedChoices).length < 2) continue;

          cards.push({
            id: `${section}:${sequence++}`,
            section,
            question: questionText,
            choices: normalizedChoices,
            answer: item?.answer == null
              ? ""
              : String(item.answer).trim().toUpperCase()
          });
        }
      }

      return cards;
    }

    function renderSetSelector() {
      setGrid.innerHTML = "";

      const grouped = {};
      for (const card of allFlashcards) {
        grouped[card.section] = (grouped[card.section] || 0) + 1;
      }

      const makeButton = (label, count, setName, isAll = false) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `set-btn${isAll ? " all-sets" : ""}`;
        button.addEventListener("click", () => startQuestionSet(setName));

        const name = document.createElement("span");
        name.className = "set-name";
        name.textContent = label;

        const total = document.createElement("span");
        total.className = "set-count";
        total.textContent = `${count} question${count === 1 ? "" : "s"}`;

        button.append(name, total);
        setGrid.appendChild(button);
      };

      makeButton("All Sets", allFlashcards.length, null, true);

      for (const [section, count] of Object.entries(grouped)) {
        makeButton(section, count, section);
      }
    }

      displayCard();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showSetSelector() {
      quizArea.hidden = true;
      setSelector.hidden = false;
      currentCard = 0;
      knownCards.clear();
      renderSetSelector();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function isSingleChoiceCard(card) {
      return /^[A-Z]$/.test(card.answer) &&
        Object.prototype.hasOwnProperty.call(card.choices, card.answer);
    }

    function renderChoices(card) {
      choices.innerHTML = "";

      for (const [letter, text] of Object.entries(card.choices)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-btn";
        button.dataset.choice = letter;
        button.addEventListener("click", () => chooseAnswer(letter));

        const badge = document.createElement("span");
        badge.className = "choice-letter";
        badge.textContent = letter;

        const label = document.createElement("span");
        label.className = "choice-text";
        label.textContent = text;

        button.append(badge, label);
        choices.appendChild(button);
      }
    }

    function resetChoices(card) {
      renderChoices(card);
      feedback.className = "feedback";

      if (isSingleChoiceCard(card)) {
        feedback.textContent = "Select an answer.";
      } else {
        feedback.textContent =
          "This item has a matching/composite answer. Choose any option to reveal the full answer key.";
      }
    }

    function displayCard() {
      if (!flashcards.length) return;

      const card = flashcards[currentCard];

      question.textContent = card.question;
      sectionLabel.textContent = activeSet || card.section;

      cardNumber.textContent =
        `Question ${currentCard + 1} of ${flashcards.length}`;

      const progress =
        ((currentCard + 1) / flashcards.length) * 100;

      percentage.textContent = `${Math.round(progress)}%`;
      progressBar.style.width = `${progress}%`;

      knownCount.textContent = knownCards.size;
      totalCards.textContent = flashcards.length;

      resetChoices(card);
    }

    function chooseAnswer(letter) {
      if (!flashcards.length) return;

      const card = flashcards[currentCard];
      const buttons =
        [...choices.querySelectorAll(".choice-btn")];

      if (!isSingleChoiceCard(card)) {
        buttons.forEach(button => {
          button.disabled = true;
          button.classList.add("dimmed");
        });

        feedback.className = "feedback";
        feedback.textContent =
          `Answer key: ${card.answer || "Not available"}`;
        return;
      }

      const correct = card.answer;

      buttons.forEach(button => {
        button.disabled = true;
        const value = button.dataset.choice;

        if (value === correct) {
          button.classList.add("correct");
        } else if (value === letter) {
          button.classList.add("wrong");
        } else {
          button.classList.add("dimmed");
        }
      });

      if (letter === correct) {
        knownCards.add(card.id);
        feedback.className = "feedback correct";
        feedback.textContent =
          `Correct! ${correct} — ${card.choices[correct]} ♡`;
      } else {
        knownCards.delete(card.id);
        feedback.className = "feedback wrong";
        feedback.textContent =
          `Not quite — the correct answer is ${correct}: ${card.choices[correct]}`;
      }

      knownCount.textContent = knownCards.size;
    }

    function nextCard() {
      if (!flashcards.length) return;
      currentCard =
        (currentCard + 1) % flashcards.length;
      displayCard();
    }

    function previousCard() {
      if (!flashcards.length) return;

      currentCard--;
      if (currentCard < 0) {
        currentCard = flashcards.length - 1;
      }

      displayCard();
    }

    function shuffleCards() {
      for (
        let i = flashcards.length - 1;
        i > 0;
        i--
      ) {
        const randomIndex =
          Math.floor(Math.random() * (i + 1));

        [
          flashcards[i],
          flashcards[randomIndex]
        ] = [
          flashcards[randomIndex],
          flashcards[i]
        ];
      }

      currentCard = 0;
      knownCards.clear();
      displayCard();
    }

    document.addEventListener("keydown", event => {
      if (quizArea.hidden || !flashcards.length) return;

      const key = event.key.toUpperCase();

      if (/^[A-Z]$/.test(key)) {
        const current = flashcards[currentCard];

        if (
          current &&
          Object.prototype.hasOwnProperty.call(
            current.choices,
            key
          )
        ) {
          chooseAnswer(key);
        }
      }

      if (event.key === "ArrowRight") {
        nextCard();
      }

      if (event.key === "ArrowLeft") {
        previousCard();
      }
    });

    function loadFlashcards() {
      try {
        const data = QUIZ_DATA;
        allFlashcards = buildFlashcards(data);

        if (!allFlashcards.length) {
          throw new Error(
            "No usable review questions were found in the embedded JSON."
          );
        }

        if (data.display_title || data.title) {
          document.title =
            data.display_title || data.title;
        }

        flashcards = [];
        currentCard = 0;
        knownCards.clear();
        renderSetSelector();
        setSelector.hidden = false;
        quizArea.hidden = true;

        console.log(
          `Loaded ${allFlashcards.length} non-deleted questions from embedded JSON.`
        );
      } catch (error) {
        console.error(error);

        setSelector.hidden = false;
        quizArea.hidden = true;
        setGrid.innerHTML = '<div class="feedback wrong">Could not load the embedded quiz data.</div>';

        question.textContent =
          "Could not load the embedded quiz data.";

        sectionLabel.textContent =
          "Load error";

        choices.innerHTML = "";

        feedback.textContent =
          "The quiz data embedded in this HTML could not be read.";

        cardNumber.textContent =
          "Load error";

        percentage.textContent =
          "0%";

        progressBar.style.width =
          "0%";

        knownCount.textContent =
          "0";

        totalCards.textContent =
          "0";
      }
    }

    loadFlashcards();
  </script>
</body>
</html>
